<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Say It on Beat — Violin</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- ===================== Setup ===================== -->
  <main id="setup" class="screen">
    <header class="setup-head">
      <h1>Say It <span>on Beat</span></h1>
      <p>Violin class edition · watch the 8 cards, then say each one on the beat</p>
    </header>

    <section class="panel">
      <div class="panel-head">
        <h2>Categories</h2>
        <div class="mini-buttons">
          <button type="button" id="selectAll">Select all</button>
          <button type="button" id="selectNone">Clear</button>
        </div>
      </div>
      <div id="categoryList" class="category-list"></div>
      <p id="categoryHint" class="hint"></p>
    </section>

    <section class="panel options">
      <h2>Options</h2>

      <div class="option" id="stringsOption">
        <label>Strings <small>for note names</small></label>
        <div class="chips" id="stringChips"></div>
      </div>

      <div class="option" id="pitchOption">
        <label>Diatonic note names</label>
        <div class="seg" id="pitchMode" role="group" aria-label="How to choose the notes">
          <button type="button" data-mode="scale">Scale</button>
          <button type="button" data-mode="chromatic">Chromatic</button>
          <button type="button" data-mode="pick">Pick notes</button>
        </div>

        <div class="sub" id="scaleSub">
          <div class="row2">
            <select id="scaleKey" aria-label="Key"></select>
            <select id="scaleType" aria-label="Scale type">
              <option value="major">Major</option>
              <option value="natural">Natural minor</option>
              <option value="harmonic">Harmonic minor</option>
              <option value="melodic">Melodic minor</option>
            </select>
          </div>
          <div class="chips" id="octaveChips">
            <button type="button" class="chip" data-oct="1">1 octave</button>
            <button type="button" class="chip" data-oct="2">2 octaves</button>
          </div>
        </div>

        <div class="sub" id="pickSub">
          <div class="pc-grid" id="pcChips"></div>
        </div>

        <div class="sub" id="rangeSub">
          <div class="row2">
            <span class="field">From <select id="rangeLow"></select></span>
            <span class="field">To <select id="rangeHigh"></select></span>
          </div>
        </div>

        <p class="sub-hint" id="pitchHint"></p>
      </div>

      <div class="option" id="rhythmOption">
        <label for="rhythmLevel">Rhythm patterns</label>
        <select id="rhythmLevel">
          <option value="basic">Basic: quarters, eighths, halves, rests</option>
          <option value="advanced">Advanced: adds sixteenths, triplets, dotted quarters</option>
        </select>
      </div>

      <div class="option">
        <label for="tempo">Starting tempo <output id="tempoOut">90 BPM</output></label>
        <input type="range" id="tempo" min="60" max="160" step="2" value="90">
      </div>

      <div class="option">
        <label for="rounds">Rounds</label>
        <select id="rounds">
          <option value="3">3</option>
          <option value="5">5</option>
          <option value="8">8</option>
          <option value="0">Keep going</option>
        </select>
      </div>

      <div class="option toggles">
        <label class="toggle"><input type="checkbox" id="speedUp"><span>Speed up each round</span></label>
        <label class="toggle"><input type="checkbox" id="showAnswers"><span>Show answers after each round</span></label>
        <label class="toggle"><input type="checkbox" id="memory"><span>Memory mode (cards flip over before you say them)</span></label>
      </div>

      <div class="option">
        <label for="volume">Music volume</label>
        <input type="range" id="volume" min="0" max="1" step="0.05" value="0.8">
      </div>
    </section>

    <footer class="setup-foot">
      <button type="button" class="secondary" id="previewBtn">Preview cards</button>
      <button type="button" class="primary" id="startBtn">Start <kbd>Space</kbd></button>
    </footer>
  </main>

  <!-- ===================== Game ===================== -->
  <main id="game" class="screen hidden" aria-live="polite">
    <div class="topbar">
      <div class="round" id="roundLabel">Round 1</div>
      <div class="phase" id="phaseLabel">Get ready</div>
      <div class="beat-info">
        <div class="beat-dots" id="beatDots"></div>
        <div class="bpm" id="bpmLabel">90 BPM</div>
      </div>
    </div>

    <div id="grid" class="grid"></div>

    <div id="countOverlay" class="overlay count hidden"></div>
    <div id="pauseOverlay" class="overlay pause hidden">
      <div>
        <div class="big">Paused</div>
        <div class="small"><span>Press <kbd>Space</kbd> or the play button to keep going</span></div>
      </div>
    </div>
    <div id="doneOverlay" class="overlay done hidden">
      <div>
        <div class="big">Great job!</div>
        <div class="small">
          <button type="button" class="primary" id="againBtn">Play again</button>
          <button type="button" class="secondary" id="backBtn">Change categories</button>
        </div>
      </div>
    </div>

    <nav class="controls" id="controls" aria-label="Game controls">
      <button type="button" id="pauseBtn" title="Pause / play (Space)"><span class="icon" id="pauseIcon">❚❚</span><span class="lbl">Pause</span></button>
      <button type="button" id="restartBtn" title="Restart this round (R)"><span class="icon">↺</span><span class="lbl">Restart round</span></button>
      <button type="button" id="nextBtn" title="Next round (N)"><span class="icon">⏭</span><span class="lbl">Next round</span></button>
      <button type="button" id="answersBtn" title="Show or hide answers (A)"><span class="icon">👁</span><span class="lbl">Answers</span></button>
      <button type="button" id="fullscreenBtn" title="Full screen (F)"><span class="icon">⛶</span><span class="lbl">Full screen</span></button>
      <button type="button" id="quitBtn" title="End game (Q)"><span class="icon">✕</span><span class="lbl">End</span></button>
    </nav>
  </main>

  <!-- ===================== Card preview ===================== -->
  <div id="preview" class="preview hidden" role="dialog" aria-modal="true" aria-labelledby="previewTitle">
    <div class="preview-inner">
      <div class="preview-head">
        <h2 id="previewTitle">Card preview</h2>
        <button type="button" class="secondary" id="previewClose">Close</button>
      </div>
      <div id="previewBody"></div>
    </div>
  </div>

  <script src="js/notation.js"></script>
  <script src="js/content.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
